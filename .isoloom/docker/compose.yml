# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: secdevlabs-streaming
services:
  db:
    build:
      context: ../../build/db
    image: isoloom/secdevlabs-streaming-db
    platform: linux/amd64
    hostname: db
    networks:
      lab:
        ipv4_address: 10.60.99.20
    volumes:
    - db-data:/var/lib/mysql
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3306
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.mariadb: tcp:3306
    restart: unless-stopped
  db-routes:
    image: alpine:3.20
    network_mode: service:db
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped
  backend:
    build:
      context: ../../build/backend
    image: isoloom/secdevlabs-streaming-backend
    platform: linux/amd64
    hostname: backend
    networks:
      lab:
        ipv4_address: 10.60.99.11
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8080}:8080
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8080
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.service.api: http:8080
    restart: unless-stopped
  backend-routes:
    image: alpine:3.20
    network_mode: service:backend
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
  frontend:
    build:
      context: ../../build/frontend
    image: isoloom/secdevlabs-streaming-frontend
    platform: linux/amd64
    hostname: frontend
    networks:
      lab:
        ipv4_address: 10.60.99.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+10007}:80
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      backend-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    labels:
      isoloom.service.web: http:80
    restart: unless-stopped
  frontend-routes:
    image: alpine:3.20
    network_mode: service:frontend
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-routes:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-routes:
        condition: service_healthy
  isoloom-check-db:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/db.sh:/isoloom/run.sh:ro
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-routes:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-routes:
        condition: service_healthy
  isoloom-check-backend:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/backend.sh:/isoloom/run.sh:ro
    network_mode: service:backend
    depends_on:
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-routes:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-routes:
        condition: service_healthy
  isoloom-check-frontend:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/frontend.sh:/isoloom/run.sh:ro
    network_mode: service:frontend
    depends_on:
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-routes:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-routes:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.99.0/24
        gateway: 10.60.99.1
volumes:
  db-data: {}
  isoloom-probe-amd64: {}
