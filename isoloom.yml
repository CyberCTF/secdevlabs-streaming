# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Streaming (secDevLabs, by Globo.com) as an Isoloom spec: an Angular live-streaming page with a
# Spring Boot backend, whose chat messages are a stored cross-site scripting flaw. Vendored
# unchanged from the app folder owasp-top10-2021-apps/a3/streaming of secDevLabs
# (build/backend/app/, build/frontend/app/, the rest in app/), built by overlays of upstream's
# Dockerfiles, with its MariaDB machine. The page calls the backend at http://localhost:8080, so
# the backend keeps upstream's published port. `isoloom generate`, then `isoloom run docker`.
version: 1
name: secdevlabs-streaming

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.99.0/24, internet: false}

machines:
  db:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {data: /var/lib/mysql}
    ports:
      mariadb:
        port: 3306
    app:
      build: build/db
  backend:
    networks: {lab: 11}
    resources: {cpus: 1, memory_mb: 1024}
    depends_on: [db]
    ports:
      api:
        port: 8080
        protocol: http
        publish: true
    app:
      build: build/backend
  frontend:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    depends_on: [backend]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/frontend

checks:
  - name: the page answers
    http: http://frontend/
    wait: 240
  - name: the backend lists the lives
    http: http://backend:8080/live
    wait: 180
  - name: seeded lives are served and the page renders messages with innerHTML
    script: checks/lives.sh

message: |
  Streaming answers at {{ machines.frontend.ports.web.url }} and its
  backend at {{ machines.backend.ports.api.url }}live. Join a live and
  chat: every viewer sees your messages.
